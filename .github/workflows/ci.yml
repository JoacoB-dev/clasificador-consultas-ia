name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: consultas
          POSTGRES_PASSWORD: consultas
          POSTGRES_DB: consultas_test
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U consultas" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["63792:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://consultas:consultas@localhost:54322/consultas_test
      TEST_REDIS_URL: redis://localhost:63792/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unitarios + integración con Postgres y Redis)
        run: pytest -v
      - name: Evaluación del clasificador simulado
        run: python evaluar.py --simulado --umbral 0.8

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
