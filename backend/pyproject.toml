[project]
name = "clasificador-consultas-ia"
version = "1.0.0"
description = "Clasificador de consultas de clientes con LLM, cola de trabajos y revisión humana (proyecto de portfolio)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: Depends(...) en los parámetros es el patrón normal de FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integracion: necesita PostgreSQL y Redis reales",
]
